# ClusterSecretStore do czanks, autenticando com a identidade COMPARTILHADA
# infisical-universal-auth (bootstrap do node, ansible/playbooks/setup-k3s.yml)
# em vez de uma identidade dedicada por cliente.
#
# default/skulls usam identidade propria (infisical-universal-auth-default /
# -skulls, ver docs/migracao-infisical-per-customer.md) — czanks e o primeiro
# tenant a reverter isso de proposito. Motivo: a identidade dedicada exige um
# bootstrap manual (kubectl create secret, mesmo padrao do token do tunnel
# Cloudflare) toda vez que um cliente novo entra, e o unico ganho real dela
# hoje e revogar UM cliente sem afetar os outros — a role `viewer` (unica
# disponivel sem plano pago do Infisical) ja enxerga o projeto inteiro
# independente de qual identidade autentica, entao nao existe isolamento de
# LEITURA entre clientes de qualquer forma. Decisao: aceitar perder a
# revogacao individual em troca de zero passo manual — vira o padrao pra
# qualquer tenant novo a partir daqui. secretsPath continua por cliente,
# ainda filtra o que cada ExternalSecret consegue ler.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-czanks-clients
spec:
  provider:
    infisical:
      hostAPI: https://us.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: "externalsecrets-i-rq2"
        environmentSlug: "prod"
        # Path exato produzido pelo modulo infisical-customer (zuno-webapp/
        # terraform): local.infisical_clients_root ("/zuno-clients") + nome
        # do cliente. Sem sufixo -prod: o Infisical ja separa prod/dev por
        # environmentSlug.
        secretsPath: "/zuno-clients/czanks"
