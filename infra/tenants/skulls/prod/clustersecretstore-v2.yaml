# ClusterSecretStore NOVO da migracao para identidade dedicada por cliente —
# ver docs/migracao-infisical-per-customer.md para o passo a passo completo.
#
# Convive com infisical-skull-prod (clustersecretstore.yaml, que continua em
# uso pelos ExternalSecret ate o cutover): os dois apontam para pastas
# diferentes no Infisical e autenticam com credenciais diferentes, entao um
# nao interfere no outro. Nome deliberadamente distinto do antigo para nao
# colidir.
#
# O Secret infisical-universal-auth-skulls referenciado abaixo AINDA NAO
# EXISTE no cluster — ele so passa a existir depois que o `terraform apply`
# do modulo infisical-customer (repo zuno-webapp/terraform) terminar e
# alguem aplicar o client_id/client_secret resultante a mao no cluster
# (bootstrap manual, mesmo padrao do Secret do token do tunnel Cloudflare em
# infra/cloudflare-tunnel-zunosite/base/deployment.yaml — nao e gerenciado
# por ExternalSecret nem por Terraform do lado do cluster). Ate isso
# acontecer, este store fica com status Invalid no ArgoCD/kubectl — esperado,
# nenhum ExternalSecret o referencia ainda.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-skulls-clients
spec:
  provider:
    infisical:
      hostAPI: https://us.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth-skulls
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth-skulls
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: "externalsecrets-i-rq2"
        environmentSlug: "prod"
        # Sem sufixo -prod (diferente do path antigo /zuno-app-prod/skulls-prod):
        # o Infisical ja separa prod/dev por environmentSlug, e repetir essa
        # informacao no path seria redundante. Path exato produzido pelo
        # modulo infisical-customer (zuno-webapp/terraform): raiz
        # local.infisical_clients_root ("/zuno-clients") + nome do cliente —
        # skull deixa de viver DENTRO da pasta do zuno-app e ganha pasta
        # irma, sem relacao hierarquica com a de zuno-app.
        secretsPath: "/zuno-clients/skulls"
