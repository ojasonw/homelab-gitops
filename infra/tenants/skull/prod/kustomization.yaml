apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zuno-skull

resources:
  - ../../../zuno-stack/base
  - frontend-service.yaml
  - clustersecretstore.yaml

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

patches:
  - path: config-patch.yaml
  - path: frontend-config-patch.yaml
  - path: postgres-secret-patch.yaml
  - path: secretstore-patch.yaml
    target:
      kind: ExternalSecret
