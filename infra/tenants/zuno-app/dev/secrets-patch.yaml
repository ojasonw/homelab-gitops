# O path /zuno-app-dev do Infisical so tem estas duas chaves — as demais
# (email, Supabase, CORS) ainda nao existem la.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
spec:
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: SPRING_JWT_SECRET
      remoteRef:
        key: SPRING_JWT_SECRET
