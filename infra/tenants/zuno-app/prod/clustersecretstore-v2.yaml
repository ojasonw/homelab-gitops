# ClusterSecretStore NOVO da migracao para identidade dedicada por cliente —
# ver docs/migracao-infisical-per-customer.md para o passo a passo completo.
#
# NOME DIVERGENTE DE PROPOSITO: este tenant continua se chamando "zuno-app"
# aqui (diretorio, namespace, Application do ArgoCD) — isso nao mudou. Mas no
# Infisical/Terraform (zuno-webapp/terraform) ele foi renomeado de "zuno-app"
# para "default", porque e o tenant que responde no apex/curinga de
# zunosite.com — o catch-all multi-tenant legado, nao um cliente especifico.
# "default" e o nome do CLIENTE la; "zuno-app" continua o nome do TENANT aqui.
# Dai o store, o secretsPath e o Secret abaixo usarem "default", mesmo dentro
# de infra/tenants/zuno-app/.
#
# Convive com infisical-zuno-app-prod (clustersecretstore.yaml, que continua
# em uso pelos ExternalSecret ate o cutover): os dois apontam para pastas
# diferentes no Infisical e autenticam com credenciais diferentes, entao um
# nao interfere no outro. Nome deliberadamente distinto do antigo para nao
# colidir.
#
# O Secret infisical-universal-auth-default ja existe no cluster (aplicado
# manualmente em 2026-08-08 a partir do output do terraform apply — mesmo
# padrao do Secret do token do tunnel Cloudflare em
# infra/cloudflare-tunnel-zunosite/base/deployment.yaml, nao e gerenciado por
# ExternalSecret nem por Terraform do lado do cluster). Depois de aplicado
# este manifesto, o store deve ficar Valid — se nao ficar, o Secret pode ter
# sido recriado com outro nome ou em outro namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-default-clients
spec:
  provider:
    infisical:
      hostAPI: https://us.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth-default
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth-default
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: "externalsecrets-i-rq2"
        environmentSlug: "prod"
        # Sem sufixo -prod (diferente do path antigo /zuno-app-prod): o
        # Infisical ja separa prod/dev por environmentSlug, e repetir essa
        # informacao no path seria redundante. Path exato produzido pelo
        # modulo infisical-customer (zuno-webapp/terraform): raiz
        # local.infisical_clients_root ("/zuno-clients") + nome do CLIENTE
        # ("default", nao "zuno-app" — ver nota no topo do arquivo).
        secretsPath: "/zuno-clients/default"
