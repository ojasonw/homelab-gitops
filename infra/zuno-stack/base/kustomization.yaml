apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base única do stack Zuno (backend + frontend), compartilhada por todos os
# tenants em infra/tenants/. Os recursos usam nomes genéricos (backend,
# frontend, config, secrets, ...) porque cada tenant vive no seu próprio
# namespace — não há colisão, e o nginx do frontend consegue apontar para
# "backend" sem saber de que tenant se trata.
resources:
  - deployment.yaml
  - service.yaml
  - nginx-config.yaml
  - configmap.yaml
  - frontend-configmap.yaml
  - externalsecret.yaml
  - imagepullsecret.yaml
  - postgres-secret.yaml
# ÚNICO lugar onde as versões de imagem são definidas. Um bump aqui atinge
# todos os tenants no próximo sync do ArgoCD. Para pinar um tenant numa
# versão diferente (canário, rollback pontual), declare o bloco `images:`
# no overlay dele — o do overlay ganha do base.
images:
  - name: ghcr.io/zuno-webapp/zuno-be
    newName: ojasonw/zuno-be
    newTag: v0.0.9
  - name: ghcr.io/zuno-webapp/zuno-frontend
    newTag: v0.0.6
    newName: ojasonw/zuno-frontend
