# Feeds infra/postgresql/chart via `auth.existingSecret`. The chart's
# secret.yaml template only renders — with a plaintext password — when
# auth.existingSecret is unset, so this ExternalSecret takes its place.
#
# target.name é definido pelo tenant-patch.yaml de cada overlay: o Application
# do postgres é separado (postgresql-<tenant>-prod) e referencia o Secret pelo
# nome antigo, que precisa ser preservado.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 8h
  secretStoreRef:
    kind: ClusterSecretStore
    # sobrescrito pelo tenant-patch.yaml de cada overlay
    name: infisical-tenant-prod
  target:
    name: postgres
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: POSTGRES_PASSWORD
