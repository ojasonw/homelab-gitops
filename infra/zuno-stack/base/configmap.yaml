# Config não-sensível comum a todos os tenants. Credenciais (senha do banco,
# JWT, email e Supabase) vêm do Infisical (ver externalsecret.yaml /
# postgres-secret.yaml).
#
# As chaves que variam por tenant — SPRING_DATASOURCE_URL, SUPABASE_BUCKET e
# FRONTEND_RESET_PASSWORD_URL — são adicionadas pelo patch de cada overlay em
# infra/tenants/<tenant>/prod/tenant-patch.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  SPRING_DATASOURCE_USERNAME: "postgres"
  SUPABASE_URL: "https://snbinsplsrupqmtmcawq.supabase.co"
  # Mesmo domínio base para todos os tenants: o TenantResolver do backend tira
  # ".zunosite.com" do header Host, independentemente de qual deployment
  # responde. Cada tenant se distingue pelo username do seu Barber.
  APP_TENANT_BASE_DOMAIN: "zunosite.com"
  # zunosite.com é hospedado na Hostinger (MX mx1/mx2.hostinger.com). Porta
  # 465 (SSL implícito) porque application-local.properties do backend seta
  # mail.smtp.ssl.enable=true (não starttls) — casado com 587 (STARTTLS) o
  # handshake falha com "Unsupported or unrecognized SSL message".
  SPRING_MAIL_HOST: "smtp.hostinger.com"
  SPRING_MAIL_PORT: "465"
  # application-local.properties (perfil ativo em prod hoje, ver
  # application.properties: spring.profiles.active=local) seta
  # ddl-auto=create-drop — sem este override, TODO restart do backend
  # (deploy, crash, OOM, o que for) recria o schema do zero e apaga os dados
  # de todos os tenants. "update" é o valor que application.properties já usa
  # pra qualquer outro perfil; sobrescreve local via env var, que tem
  # precedência sobre application-{profile}.properties no Spring Boot.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  # Backend passa a confiar em X-Forwarded-For/X-Real-IP só quando o request
  # vem de um proxy confiável (branch zuno-webapp/backend TASK/S01-IA, ainda
  # sem PR — ver ClientIpResolver). Todo tráfego chega no backend só depois de
  # passar pelo nginx do frontend (mesmo pod network, backend é ClusterIP-only
  # — ver nginx-config.yaml), então o "proxy confiável" é o pod do nginx, cujo
  # IP varia dentro do CIDR de pods do cluster. k3s aqui roda com o flannel
  # padrão (sem --cluster-cidr custom no playbook do Ansible), daí 10.42.0.0/16
  # em vez de um IP fixo. Sem isso, o rate limit por telefone/IP passa a
  # enxergar só o IP do pod do nginx para todo mundo — não quebra nada, só
  # inutiliza o rate limit por IP (todo cliente cai no mesmo bucket).
  # Inofensivo para a imagem hoje em prod (v0.0.13): essa var não existe no
  # código antigo, então fica sem uso até a imagem nova subir.
  TRUSTED_PROXIES: "10.42.0.0/16"
  # NÃO ATIVAR ainda — ver PR description. A imagem hoje em prod (v0.0.13)
  # não tem application-prod.properties; forçar profile "prod" nela desativa
  # o "local" (hardcoded em application.properties) sem nada para substituí-lo,
  # e spring.mail.username/password/support, spring.cors.urls, supabase.bucket
  # e app.frontend.reset-password-url só existem dentro do arquivo do profile
  # ativo — ficariam undefined. Só descomentar depois que a imagem com
  # application-prod.properties (mesma branch acima) estiver no ar.
  # SPRING_PROFILES_ACTIVE: "prod"
