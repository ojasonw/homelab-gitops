apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/zuno-webapp/zuno-be:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: config
        - secretRef:
            name: secrets
        env:
        # sendHtmlMail/sendEmailForgotPassword não chamam setFrom, então o
        # JavaMail cai em root@<hostname-do-pod> e a Hostinger devolve
        # "450 4.1.8 Sender address rejected: Domain not found". Definir
        # mail.from cobre o header From e o envelope. Remover quando o fix
        # em zuno-webapp/backend#8 estiver na imagem.
        - name: SPRING_MAIL_PROPERTIES_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: secrets
              key: EMAIL_USERNAME
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/zuno-webapp/zuno-frontend:latest
        envFrom:
        - configMapRef:
            name: frontend-config
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
