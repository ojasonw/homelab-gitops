apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        # Opt-in genérico do Beyla (infra/beyla/base,
        # discovery.instrument por k8s_pod_labels) — na base compartilhada
        # de propósito, pra valer pra todo cliente Zuno (zuno-app, skulls,
        # os que vierem depois) sem precisar de patch por tenant.
        beyla.grafana.com/instrument: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/zuno-webapp/zuno-be:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: config
        - secretRef:
            name: secrets
        env:
        # sendHtmlMail/sendEmailForgotPassword não chamam setFrom, então o
        # JavaMail cai em root@<hostname-do-pod> e a Hostinger devolve
        # "450 4.1.8 Sender address rejected: Domain not found". Definir
        # mail.from cobre o header From e o envelope. Remover quando o fix
        # em zuno-webapp/backend#8 estiver na imagem.
        - name: SPRING_MAIL_PROPERTIES_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: secrets
              key: EMAIL_USERNAME
        # Boot do Spring Boot 4 / Java 21 leva ~50-58s neste cluster (node
        # unico, todos os pods de todos os tenants disputando a mesma CPU).
        # Sem startupProbe, a liveness (antes: initialDelaySeconds 30,
        # periodSeconds 20) as vezes matava o container poucos ms depois dele
        # terminar de subir — "failed liveness probe" logo apos "Started
        # ZunoBeApplication", reiniciando em loop (e, por causa do ddl-auto,
        # apagando o banco de novo a cada uma dessas mortes). Enquanto o
        # startupProbe nao passa, liveness/readiness nao rodam.
        startupProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            # Subido de 500m pra 1500m em 2026-08-14: testes de carga (5, 15
            # requisições concorrentes de agendamento) mostraram o node
            # 85-97% ocioso durante o pico, mas o boot da JVM sofrendo
            # throttling de CFS (98.8% dos períodos a 500m, medido via
            # cpu.stat) — o node tem folga real (4 vCPU, ~800m de request
            # comprometido hoje), só o limite por container é que estava
            # curto. 1.5 core deixa ~2.3 cores de folga pros dois tenants +
            # frontend + postgres, mesmo se os dois bootarem ao mesmo tempo.
            cpu: 1500m
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/zuno-webapp/zuno-frontend:latest
        envFrom:
        - configMapRef:
            name: frontend-config
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
