# Non-sensitive backend config — internal DNS, a well-known default DB user,
# and other non-secret values. Credentials (DB password, JWT secret, email
# and Supabase creds) live in Infisical instead (see externalsecret.yaml /
# postgres-secret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuno-app-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-zuno-app-prod:5432/zuno-db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SUPABASE_URL: "https://ycpxtencdkkwxzdihpqr.supabase.co"
  SUPABASE_BUCKET: "zuno-bucket"
  FRONTEND_RESET_PASSWORD_URL: "https://zunosite.com/admin/redefinir-senha"
  APP_TENANT_BASE_DOMAIN: "zunosite.com"
  # zunosite.com é hospedado na Hostinger (MX mx1/mx2.hostinger.com), não no
  # Google — o smtp.gmail.com embutido no application-*.properties do backend
  # nunca autentica. Estas duas chaves sobrescrevem spring.mail.host/port.
  SPRING_MAIL_HOST: "smtp.hostinger.com"
  SPRING_MAIL_PORT: "587"
